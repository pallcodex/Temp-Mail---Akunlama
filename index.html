<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temp Mail - ppalw</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #e2e8f0; display: flex; justify-content: center; padding: 20px 12px; min-height: 100vh; }
    .container { width: 100%; max-width: 680px; background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 20px; }
    .title { font-size: 1.4rem; font-weight: 800; color: #fb923c; }
    .subtitle { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
    .badge { font-size: 0.75rem; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: #0f172a; color: #64748b; border: 1px solid #334155; }
    .badge.ready { background: rgba(16, 185, 129, 0.1); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
    
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .input-group { flex: 1; min-width: 200px; display: flex; gap: 8px; }
    input[type="text"] { flex: 1; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; outline: none; }
    input[type="text"]:focus { border-color: #f97316; }
    button { cursor: pointer; border: none; border-radius: 10px; font-weight: 600; font-size: 0.85rem; padding: 10px 16px; transition: all 0.2s; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }
    .btn-primary { background: linear-gradient(135deg, #f97316, #fbbf24); color: #0f172a; font-weight: 700; width: 100%; }
    .btn-primary:hover { opacity: 0.9; }
    @media(min-width: 500px) { .btn-primary { width: auto; } }

    .card { background: #0f172a; border: 1px solid #334155; padding: 16px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .email-label { font-size: 0.75rem; color: #64748b; display: block; margin-bottom: 2px; }
    .email-val { font-family: monospace; font-size: 1.05rem; font-weight: 700; color: #fb923c; word-break: break-all; }
    .card-btns { display: flex; gap: 8px; }
    .btn-sm { padding: 6px 12px; font-size: 0.75rem; border-radius: 8px; }
    .btn-outline { background: transparent; color: #fb923c; border: 1px solid rgba(251, 146, 60, 0.3); }
    .btn-outline:hover { background: rgba(251, 146, 60, 0.1); }

    .inbox-header { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 10px; }
    .inbox-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; margin-bottom: 20px; }
    .empty-state { text-align: center; padding: 30px; color: #64748b; font-size: 0.85rem; border: 1px dashed #334155; border-radius: 12px; font-style: italic; }
    .mail-item { background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
    .mail-item:hover { background: #1e293b; }
    .mail-sender { font-size: 0.75rem; color: #fb923c; font-weight: 600; }
    .mail-subject { font-size: 0.85rem; font-weight: 600; color: #f1f5f9; margin-top: 2px; }
    .mail-time { font-size: 0.7rem; color: #64748b; white-space: nowrap; }

    .reader { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 18px; display: none; margin-top: 15px; }
    .reader.active { display: block; }
    .reader-top { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 12px; }
    .reader-title { font-size: 1.1rem; color: #fdba74; font-weight: 700; }
    .reader-sub { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
    .close-btn { background: none; color: #64748b; font-size: 1.2rem; padding: 0 4px; }
    .close-btn:hover { color: #f8fafc; }

    .otp-box { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 12px; }
    .otp-title { font-size: 0.7rem; color: #34d399; font-weight: 600; }
    .otp-code { font-family: monospace; font-size: 1.4rem; font-weight: 800; color: #6ee7b7; letter-spacing: 2px; }

    .links-box { margin-bottom: 12px; }
    .links-title { font-size: 0.75rem; color: #94a3b8; font-weight: 600; margin-bottom: 6px; }
    .links-flex { display: flex; flex-wrap: wrap; gap: 8px; }
    .link-btn { display: inline-block; background: rgba(249, 115, 22, 0.15); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.3); padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-family: monospace; text-decoration: none; word-break: break-all; }
    .link-btn:hover { background: rgba(249, 115, 22, 0.25); }

    .mail-body { background: #020617; border: 1px solid #1e293b; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; color: #cbd5e1; white-space: pre-wrap; max-height: 220px; overflow-y: auto; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div>
        <div class="title">Temp Mail Dashboard</div>
        <div class="subtitle">Akunlama API · Powered by Noapl</div>
      </div>
      <div id="status-badge" class="badge">● Offline</div>
    </div>

    <div class="controls">
      <div class="input-group">
        <input id="username-input" type="text" placeholder="Masukkan username custom...">
        <button onclick="setCustomEmail()" class="btn-secondary">Set</button>
      </div>
      <button onclick="generateRandom()" class="btn-primary">Random Email</button>
    </div>

    <div class="card">
      <div>
        <span class="email-label">Active Address</span>
        <div id="active-email" class="email-val">Belum Dipilih</div>
      </div>
      <div class="card-btns">
        <button onclick="copyEmail()" class="btn-secondary btn-sm">Salin</button>
        <button onclick="loadInbox()" class="btn-outline btn-sm">Refresh</button>
      </div>
    </div>

    <div>
      <div class="inbox-header">
        <span>Inbox List</span>
        <span id="inbox-count">0 Pesan</span>
      </div>
      <div id="inbox-container" class="inbox-list">
        <div class="empty-state">Pilih atau buat email untuk melihat pesan masuk.</div>
      </div>
    </div>

    <div id="reader-box" class="reader">
      <div class="reader-top">
        <div>
          <div id="mail-subject" class="reader-title"></div>
          <div id="mail-from" class="reader-sub"></div>
          <div id="mail-date" class="reader-sub" style="font-size: 0.65rem;"></div>
        </div>
        <button onclick="closeReader()" class="close-btn">✕</button>
      </div>

      <div id="otp-container" class="otp-box" style="display: none;">
        <div class="otp-title">Kode OTP Detected</div>
        <div id="otp-code" class="otp-code"></div>
      </div>

      <div id="links-container" class="links-box" style="display: none;">
        <div class="links-title">Link Ditemukan (Klik untuk Buka):</div>
        <div id="links-list" class="links-flex"></div>
      </div>

      <div>
        <div class="links-title">Isi Pesan:</div>
        <div id="mail-body" class="mail-body"></div>
      </div>
    </div>
  </div>

<script>
  // Dynamic API Base URL menembak ke domain Vercel kamu
  const API_BASE = window.location.origin + '/api';

  let currentUsername = '';
  let autoRefreshInterval = null;

  // 1. Fungsi Dapatkan / Set Mailbox Baru
  async function generateEmail() {
    try {
      showLoading(true);
      const res = await fetch(`${API_BASE}/gen`);
      const data = await res.json();

      if (data.status === 'success') {
        currentUsername = data.data.username;
        updateEmailDisplay(data.data.email);
        await checkInbox();
        startAutoRefresh();
      } else {
        alert('Gagal mendapatkan email: ' + (data.message || 'Error'));
      }
    } catch (err) {
      console.error('Fetch error:', err);
      alert('Gagal terhubung ke API Vercel.');
    } finally {
      showLoading(false);
    }
  }

  // 2. Fungsi Set Custom Email
  async function setCustomEmail(customName) {
    if (!customName || !customName.trim()) {
      alert('Masukkan username email yang diinginkan!');
      return;
    }

    try {
      showLoading(true);
      const cleanUser = customName.trim().replace(/@.*/, '');
      const res = await fetch(`${API_BASE}/use?user=${encodeURIComponent(cleanUser)}`);
      const data = await res.json();

      if (data.status === 'success') {
        currentUsername = data.data.username;
        updateEmailDisplay(data.data.email);
        await checkInbox();
        startAutoRefresh();
      } else {
        alert(data.message || 'Custom email tidak valid');
      }
    } catch (err) {
      console.error('Fetch error:', err);
      alert('Gagal terhubung ke API Vercel.');
    } finally {
      showLoading(false);
    }
  }

  // 3. Fungsi Cek & Ambil Inbox
  async function checkInbox() {
    if (!currentUsername) return;

    try {
      const res = await fetch(`${API_BASE}/inbox?user=${encodeURIComponent(currentUsername)}`);
      const data = await res.json();

      if (data.status === 'success') {
        renderInboxTable(data.messages || []);
      }
    } catch (err) {
      console.error('Error fetching inbox:', err);
    }
  }

  // 4. Fungsi Baca Detail Email (Dengan OTP & Link)
  async function readEmail(indexOrKey) {
    if (!currentUsername) return;

    try {
      showLoading(true);
      const res = await fetch(`${API_BASE}/read?user=${encodeURIComponent(currentUsername)}&index=${encodeURIComponent(indexOrKey)}`);
      const data = await res.json();

      if (data.status === 'success') {
        renderEmailDetail(data.data);
      } else {
        alert('Gagal membaca pesan: ' + data.message);
      }
    } catch (err) {
      console.error('Error reading email:', err);
      alert('Gagal terhubung ke API Vercel.');
    } finally {
      showLoading(false);
    }
  }

  // Auto Refresh Inbox setiap 5 detik
  function startAutoRefresh() {
    if (autoRefreshInterval) clearInterval(autoRefreshInterval);
    autoRefreshInterval = setInterval(checkInbox, 5000);
  }

  // Helper UI Renderer (Disesuaikan dengan ID Element HTML kamu)
  function updateEmailDisplay(emailStr) {
    const el = document.getElementById('email-address') || document.getElementById('email') || document.getElementById('email-display');
    if (el) {
      if (el.tagName === 'INPUT') el.value = emailStr;
      else el.innerText = emailStr;
    }
  }

  function renderInboxTable(messages) {
    const container = document.getElementById('inbox-list') || document.getElementById('messages') || document.querySelector('tbody');
    if (!container) return;

    if (messages.length === 0) {
      container.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 20px;">Belum ada email masuk. Menunggu pesan...</td></tr>`;
      return;
    }

    container.innerHTML = messages.map(msg => `
      <tr onclick="readEmail('${msg.index}')" style="cursor:pointer;">
        <td><strong>${escapeHtml(msg.from || 'Unknown')}</strong></td>
        <td>${escapeHtml(msg.subject || '(No Subject)')}</td>
        <td>${new Date(msg.date).toLocaleTimeString()}</td>
        <td><button type="button" onclick="event.stopPropagation(); readEmail('${msg.index}')">Baca</button></td>
      </tr>
    `).join('');
  }

  function renderEmailDetail(detail) {
    const modal = document.getElementById('email-modal') || document.getElementById('modal');
    const content = document.getElementById('email-content') || document.getElementById('message-detail');

    const htmlBody = `
      <div style="padding: 15px; border: 1px solid #ccc; border-radius: 8px;">
        <h3>${escapeHtml(detail.subject)}</h3>
        <p><strong>Dari:</strong> ${escapeHtml(detail.from)}</p>
        ${detail.otp ? `<div style="background:#e8f5e9; padding:10px; border-radius:5px; font-weight:bold; color:#2e7d32;">Kode OTP/Verifikasi: ${detail.otp}</div>` : ''}
        <hr/>
        <div style="margin-top:15px;">${detail.html || `<pre>${escapeHtml(detail.text)}</pre>`}</div>
      </div>
    `;

    if (content) content.innerHTML = htmlBody;
    if (modal) modal.style.display = 'block';
    else alert(`[PESAN MASUK]\n\nPengirim: ${detail.from}\nSubjek: ${detail.subject}\n\nIsi:\n${detail.text}`);
  }

  function showLoading(state) {
    const spinner = document.getElementById('loading') || document.getElementById('spinner');
    if (spinner) spinner.style.display = state ? 'block' : 'none';
  }

  function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }

  // Auto Generate Email saat halaman pertama kali di-load
  document.addEventListener('DOMContentLoaded', () => {
    generateEmail();

    // Event listener untuk tombol Custom Email (jika ada tombol id "btn-custom")
    const btnCustom = document.getElementById('btn-custom') || document.getElementById('btn-change');
    if (btnCustom) {
      btnCustom.addEventListener('click', () => {
        const input = document.getElementById('input-custom') || document.getElementById('custom-username');
        if (input) setCustomEmail(input.value);
        else {
          const name = prompt('Masukkan username email custom yang diinginkan:');
          if (name) setCustomEmail(name);
        }
      });
    }

    // Event listener untuk tombol Refresh (jika ada tombol id "btn-refresh")
    const btnRefresh = document.getElementById('btn-refresh');
    if (btnRefresh) {
      btnRefresh.addEventListener('click', checkInbox);
    }
  });
</script>
</body>
</html>
